# ANIMUS 1.0 — rate-limit + connection zones (http context, via conf.d).
# Keyed on the REAL client address ($binary_remote_addr = the TCP peer nginx
# sees, which a client cannot spoof at this layer). Tuned generously so only
# automated floods are throttled — a whole team of humans behind one NAT'd
# egress IP clicking through the console stays well under these ceilings.
server_tokens off;

limit_req_zone  $binary_remote_addr  zone=tmpl_api:10m    rate=10r/s;
limit_req_zone  $binary_remote_addr  zone=tmpl_login:10m  rate=10r/m;
limit_conn_zone $binary_remote_addr  zone=tmpl_conn:10m;

limit_req_status  429;
limit_conn_status 429;
