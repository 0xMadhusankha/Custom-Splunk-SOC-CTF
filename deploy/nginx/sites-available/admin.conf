server {
    server_name animus.templarhq.xyz;

    root /var/www/admin;
    index index.html;

    include /etc/nginx/snippets/templar-headers.conf;
    client_max_body_size 64k;

    # Organizer login — strict brute-force throttle (defense in depth over the
    # relay's own per-IP login limiter).
    location ^~ /api/auth/ {
        limit_req zone=tmpl_login burst=10 nodelay;
        include /etc/nginx/snippets/templar-proxy.conf;
    }

    # Sound upload/list — the only endpoint that accepts a large body.
    location = /api/sounds {
        client_max_body_size 25m;
        limit_req zone=tmpl_api burst=30 nodelay;
        include /etc/nginx/snippets/templar-proxy.conf;
    }

    # Player auth has no purpose on the organizer domain — deny it.
    location ^~ /api/player-auth/ { return 404; }

    location /api/ {
        limit_req zone=tmpl_api burst=30 nodelay;
        limit_conn tmpl_conn 40;
        include /etc/nginx/snippets/templar-proxy.conf;
    }

    location /realtime {
        limit_conn tmpl_conn 40;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/animus.templarhq.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/animus.templarhq.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = animus.templarhq.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name animus.templarhq.xyz;
    return 404; # managed by Certbot
}
