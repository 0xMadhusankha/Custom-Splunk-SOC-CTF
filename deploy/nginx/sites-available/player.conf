server {
    server_name soc.templarhq.xyz;

    root /var/www/player;
    index index.html;

    include /etc/nginx/snippets/templar-headers.conf;
    client_max_body_size 64k;

    # ================= PLAYER API — explicit allowlist =================
    # Only the endpoints the player console actually uses are proxied. Every
    # other /api/* path (organizer login/refresh, voice push, scheduled queue,
    # audit, and all broadcast/sound mutations) falls through to the
    # deny-by-default 404 below — they are not part of the player surface, so
    # they cannot be reached, enumerated, or brute-forced from this domain.

    location = /api/health {
        include /etc/nginx/snippets/templar-proxy.conf;
    }

    location ^~ /api/player-auth/ {
        limit_req zone=tmpl_login burst=10 nodelay;
        include /etc/nginx/snippets/templar-proxy.conf;
    }

    location = /api/search {
        limit_req zone=tmpl_api burst=30 nodelay;
        limit_conn tmpl_conn 40;
        include /etc/nginx/snippets/templar-proxy.conf;
    }

    location = /api/search/anchor {
        limit_req zone=tmpl_api burst=30 nodelay;
        include /etc/nginx/snippets/templar-proxy.conf;
    }

    # live broadcasts: read-only for players (GET); mutations are organizer-only.
    location = /api/broadcasts {
        limit_except GET { deny all; }
        limit_req zone=tmpl_api burst=30 nodelay;
        include /etc/nginx/snippets/templar-proxy.conf;
    }

    # sound library: list (GET) + fetch a file; upload/edit/delete are organizer-only.
    location = /api/sounds {
        limit_except GET { deny all; }
        limit_req zone=tmpl_api burst=30 nodelay;
        include /etc/nginx/snippets/templar-proxy.conf;
    }
    location ~ ^/api/sounds/[^/]+/file$ {
        limit_req zone=tmpl_api burst=30 nodelay;
        include /etc/nginx/snippets/templar-proxy.conf;
    }

    location /realtime {
        limit_conn tmpl_conn 40;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # deny by default: any other /api/* is not a player endpoint.
    location /api/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/soc.templarhq.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/soc.templarhq.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = soc.templarhq.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name soc.templarhq.xyz;
    return 404; # managed by Certbot
}
